[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-abi-lab"
version = "0.9.0"
description = "Reproducible experiments for hidden layout contracts between tensor producers and vendor GEMM kernels"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
  {name = "Sheng-Kai Ku", email = "ethankai0714@gmail.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
layoutabi = "layoutabi.cli:main"

[tool.setuptools.packages.find]
include = ["layoutabi*"]

[tool.setuptools.package-data]
layoutabi = ["schemas/*.json", "workloads/cases/*.json"]

[tool.ruff]
line-length = 100
target-version = "py38"
