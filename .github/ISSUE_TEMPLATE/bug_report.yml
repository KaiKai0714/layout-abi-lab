name: Bug report
description: Report a reproducibility, correctness, packaging, or compatibility problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste redacted output from `layoutabi check`.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true

