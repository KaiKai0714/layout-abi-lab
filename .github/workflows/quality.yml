name: quality

on:
  push:
  pull_request:

jobs:
  cpu-safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q layoutabi containers
      - run: layoutabi --help
      - run: layoutabi prepare-submission --help
      - run: layoutabi migrate-schema --help
      - run: layoutabi inspect-model --help
      - run: layoutabi optimize-model --help
      - run: layoutabi audit-compile --help
      - run: layoutabi validate-audit --help
      - run: layoutabi list-workloads --help
      - run: layoutabi list-workloads
      - run: layoutabi evaluate-planner --help
      - run: layoutabi evaluate-planner
      - run: python containers/run_matrix.py --help
      - run: python -m unittest discover -s tests -v
      - run: layoutabi validate-tree results/reference_l40s --strict
      - run: layoutabi aggregate --check

  optimizer-cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m compileall -q layoutabi
      - run: python -m unittest discover -s tests -v
