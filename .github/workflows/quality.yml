name: quality

on:
  push:
  pull_request:

jobs:
  cpu-safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q layoutabi containers
      - run: layoutabi --help
      - run: python containers/run_matrix.py --help
      - run: python -m unittest discover -s tests -v
